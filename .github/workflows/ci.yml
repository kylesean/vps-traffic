name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (model contract tests)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python + bash shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3

      - name: Validate the plugin manifest and entry points
        run: |
          # Omarchy isn't installed on the runner, so mirror its validator here:
          # required fields, a safe (relative, no "..") entry point per kind that
          # exists, and no symlinks anywhere in the tree.
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const entryKey = (kind) => kind === "bar-widget" ? "barWidget" : kind;

          for (const k of ["id", "name", "version", "kinds", "entryPoints"])
            if (!(k in m)) { console.error("missing required field: " + k); process.exit(1); }
          if (!Array.isArray(m.kinds) || m.kinds.length === 0) { console.error("kinds must be a non-empty array"); process.exit(1); }
          if (m.entryPoints === null || typeof m.entryPoints !== "object") { console.error("entryPoints must be an object"); process.exit(1); }
          if (m.schemaVersion !== 1) { console.error("schemaVersion must be 1"); process.exit(1); }

          for (const kind of m.kinds) {
            const ep = m.entryPoints[entryKey(kind)];
            if (typeof ep !== "string") { console.error("no entry point for kind: " + kind); process.exit(1); }
            if (ep.startsWith("/") || ep.includes("..")) { console.error("unsafe entry point (must be a relative path): " + ep); process.exit(1); }
            if (!fs.existsSync(path.join(process.cwd(), ep))) { console.error("entry point does not exist: " + ep); process.exit(1); }
          }

          if (m.barWidget && m.barWidget.defaultSection) {
            const s = String(m.barWidget.defaultSection);
            if (!["left", "center", "right"].includes(s)) { console.error("invalid barWidget.defaultSection: " + s); process.exit(1); }
          }

          // No symlinks anywhere (official validator rejects them, .git allowed).
          const walk = (dir) => {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              const st = fs.lstatSync(p);
              if (st.isSymbolicLink()) { console.error("symlink not allowed: " + p); process.exit(1); }
              if (st.isDirectory() && e.name !== ".git") walk(p);
            }
          };
          walk(".");

          console.log("manifest OK");
          NODE

      - name: Bash syntax check
        run: bash -n bin/vps-traffic

      - name: Shellcheck the CLI
        run: shellcheck bin/vps-traffic

      - name: Model contract tests
        run: node omarchy/model.test.mjs

      - name: CLI credentials contract tests (stdin write & mode 600 read)
        run: |
          # Test writing credentials via stdin
          echo '{"veid":"999999","api_key":"test_key_123"}' | bin/vps-traffic --creds-write kiwivm
          # Test reading saved credentials
          creds=$(bin/vps-traffic --creds-read kiwivm)
          echo "$creds" | grep -q '"veid": "999999"' || { echo "creds-read failed"; exit 1; }
          echo "$creds" | grep -q '"key_present": true' || { echo "key_present check failed"; exit 1; }
          # Test file permissions (mode 600)
          perms=$(stat -c "%a" "$HOME/.config/vps-traffic/kiwivm/env" 2>/dev/null || stat -f "%Lp" "$HOME/.config/vps-traffic/kiwivm/env")
          [ "$perms" = "600" ] || { echo "expected mode 600, got $perms"; exit 1; }
          # Clean up test files
          rm -rf "$HOME/.config/vps-traffic/kiwivm"

      - name: CLI contract (unsupported provider fails, missing creds fails)
        run: |
          set +e
          bin/vps-traffic --provider not-a-provider --json
          [ $? -ne 0 ] || { echo "expected failure for unknown provider"; exit 1; }
          VPS_TRAFFIC_CONF=/nonexistent bin/vps-traffic --provider vultr --json 2>/dev/null
          [ $? -ne 0 ] || { echo "expected failure for missing creds"; exit 1; }
